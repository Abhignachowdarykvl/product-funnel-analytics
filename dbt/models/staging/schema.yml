version: 2

models:
  - name: stg_ga4_events
    description: "Flat GA4 events with unnested parameters."
    columns:
      - name: user_pseudo_id
        tests: [not_null]
      - name: event_name
        tests: [not_null]
      - name: event_date
        tests: [not_null]

  - name: stg_ga4_sessions
    description: "One row per user session with aggregated metrics."
    columns:
      - name: user_pseudo_id
        tests: [not_null]
      - name: session_id
        tests: [not_null]
      - name: converted
        tests:
          - not_null
